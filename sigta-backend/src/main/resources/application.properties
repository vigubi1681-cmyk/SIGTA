spring.application.name=sigta-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/sigta_chorrillos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=sigta
spring.datasource.password=${DB_PASSWORD}

sigta.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-caracteres}
sigta.jwt.expiracion-horas=8

# Administrador que se crea automáticamente si no existe
sigta.admin.correo=admin@sigta.local
sigta.admin.password=${ADMIN_PASSWORD}

sigta.storage.ruta=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

